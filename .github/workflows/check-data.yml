name: Check archive data

on:
  push:
    paths: ["data/**", "assets/images/**", "tools/check-data.py"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python tools/check-data.py
