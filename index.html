<!doctype html>
<html lang="en">
<head>

  <link rel="stylesheet" href="css/main.css?v=2">

<body class="startup-page">

    <span>COLLECTION ARCHIVE // OPERATING SYSTEM</span>
    <span id="clock">00:00:00</span>
  </header>

  <main class="os-stage" aria-live="polite">

      <h1>ARCHIVE</h1>
      <p>ALL SYSTEMS NOMINAL</p>

  <div class="os-sweep" aria-hidden="true"></div>

  <footer class="os-bar os-bottom">
    <span>REV 2.6 // UNIT ARC-01</span>
    <span id="bootPercent">BOOT 000</span>
  </footer>

  <noscript>
    <div class="noscript-box">
      JavaScript is required for the startup sequence.
      <a href="archive.html">Open the archive directly.</a>
    </div>
  </noscript>

  <script src="js/startup.js?v=2"></script>
